# Reverse proxy: /Servicios/ → localhost:8076 (consulta-doc)
# Agregar este bloque dentro del VirtualHost:443 de microservicio.codeplex.cloud

SSLProxyEngine      on
SSLProxyVerify      none
ProxyPreserveHost   on

ProxyPass        /Servicios/  https://127.0.0.1:8076/Servicios/
ProxyPassReverse /Servicios/  https://127.0.0.1:8076/Servicios/

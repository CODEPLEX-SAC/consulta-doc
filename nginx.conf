worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name microservicio.codeplex.cloud;

        ssl_certificate     C:/Certbot/live/microservicio.codeplex.cloud/fullchain.pem;
        ssl_certificate_key C:/Certbot/live/microservicio.codeplex.cloud/privkey.pem;

        location / {
            proxy_pass         https://127.0.0.1:8076/;
            proxy_ssl_verify   off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}

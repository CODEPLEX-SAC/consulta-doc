worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path  temp/client_body_temp;
    proxy_temp_path        temp/proxy_temp;
    fastcgi_temp_path      temp/fastcgi_temp;
    uwsgi_temp_path        temp/uwsgi_temp;
    scgi_temp_path         temp/scgi_temp;

    server {
        listen 443 ssl;
        server_name microservicio.codeplex.cloud;

        ssl_certificate     C:/Certbot/live/microservicio.codeplex.cloud/fullchain.pem;
        ssl_certificate_key C:/Certbot/live/microservicio.codeplex.cloud/privkey.pem;

        location / {
            proxy_pass         https://127.0.0.1:8076/;
            proxy_ssl_verify   off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
